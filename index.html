<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile Tournament Manager</title>
    <style>
        :root {
            --accent-color: #3bbfad;
            --accent-hover: #319e91;
            --group-color: #f39c12;
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --bg-element: #252525;
            --text-main: #e0e0e0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
        }
        /* Promenjena boja glavnih naslova u nijansu bele */
        h1, h2, h3, h4 {
            color: #f0f0f0;
            text-align: center;
        }
        .group-title {
            color: var(--group-color) !important;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .active-tournament-banner {
            background: #22252a;
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: var(--bg-card);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        .nav-tab {
            background: none;
            border: none;
            color: #888;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            padding: 6px 10px;
            white-space: nowrap;
        }
        .nav-tab.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }
        .nav-tab.hidden {
            display: none !important;
        }
        .section {
            display: none;
            background: var(--bg-card);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .section.active {
            display: block;
        }
        textarea, input[type="text"] {
            width: 100%;
            background: #2d2d2d;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        textarea {
            height: 140px;
            resize: vertical;
        }
        button.action-btn {
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            display: block;
            width: 100%;
            margin-top: 10px;
        }
        button.action-btn:hover {
            background-color: var(--accent-hover);
        }
        .secondary-btn {
            background-color: #333;
            color: #fff;
        }
        .tournament-item {
            background: var(--bg-element);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        
        /* Tabela sa narandžastim pozicijama i bez plave pozadine redova */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 11px;
            background-color: #1a1e23;
            color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #2a3038;
            padding: 8px 3px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        th {
            background-color: #101418;
            color: #7b8a95;
            font-size: 10px;
            text-transform: uppercase;
            border-bottom: 2px solid #333;
        }

        .pos-cell {
            font-weight: bold;
            color: #fff;
        }
        .pos-1 {
            background-color: #f39c12 !important;
            color: #000 !important;
            font-weight: bold;
        }
        .pos-2 {
            background-color: #f39c12 !important;
            color: #000 !important;
            font-weight: bold;
        }
        .club-cell {
            text-align: left;
            padding-left: 8px;
            font-weight: 500;
        }

        th:nth-child(1), td:nth-child(1) { width: 10%; } /* POS */
        th:nth-child(2), td:nth-child(2) { width: 38%; } /* CLUB */
        th:nth-child(3), td:nth-child(3) { width: 8%; }  /* P */
        th:nth-child(4), td:nth-child(4) { width: 8%; }  /* W */
        th:nth-child(5), td:nth-child(5) { width: 8%; }  /* D */
        th:nth-child(6), td:nth-child(6) { width: 8%; }  /* L */
        th:nth-child(7), td:nth-child(7) { width: 10%; } /* GD */
        th:nth-child(8), td:nth-child(8) { width: 10%; font-weight: bold; color: var(--accent-color); } /* PTS */

        .round-tabs {
            display: flex;
            gap: 5px;
            margin: 10px 0 15px 0;
            justify-content: center;
        }
        .round-btn {
            padding: 6px 14px;
            background: #333;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            font-weight: bold;
            font-size: 13px;
        }
        .round-btn.active {
            background: var(--accent-color);
            color: #121212;
        }
        
        .match-card {
            background: var(--bg-element);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #333;
        }
        .match-header {
            text-align: center;
            font-size: 10px;
            color: #aaa;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .match-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .team-name {
            font-weight: bold;
            flex: 1;
            text-align: left;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            background: #252b33;
            padding: 4px 6px;
            border-radius: 4px;
        }
        .score-box-container {
            display: flex;
            gap: 2px;
            margin: 0 6px;
        }
        .score-box {
            background: #2d2d2d;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            color: var(--accent-color);
            border: 1px solid #444;
            min-width: 18px;
            text-align: center;
        }
        .score-box:hover {
            border-color: var(--accent-color);
        }
        .status-badge {
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 4px;
            color: white;
            margin-top: 6px;
            text-align: center;
            display: inline-block;
            font-weight: bold;
            text-transform: uppercase;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--accent-color);
            width: 280px;
        }
        .modal-content input {
            width: 50px;
            padding: 8px;
            text-align: center;
            font-size: 18px;
            background: #2d2d2d;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
        }

        .ss-fullscreen-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0d0f12;
            z-index: 3000;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
        }
        .ss-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 8px;
        }

        .bracket-round-title {
            color: var(--accent-color);
            font-size: 14px;
            font-weight: bold;
            margin: 15px 0 10px 0;
            text-align: center;
            border-bottom: 1px dashed #444;
            padding-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>FC Mobile Tournament</h1>

    <div id="active-banner" class="active-tournament-banner">
        Active Tournament: <b id="active-name-display" style="color: var(--accent-color);">None selected</b>
    </div>

    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('tournaments')">Tournaments</button>
        <button id="tab-setup" class="nav-tab hidden" onclick="switchTab('setup')">Setup</button>
        <button id="tab-draw" class="nav-tab hidden" onclick="switchTab('draw')">Draw</button>
        <button class="nav-tab" onclick="switchTab('standings')">Standings</button>
        <button class="nav-tab" onclick="switchTab('matches')">Matches</button>
        <button class="nav-tab" onclick="switchTab('bracket')">Bracket</button>
    </div>

    <div id="tournaments-section" class="section active">
        <h2>Manage Tournaments</h2>
        <input type="text" id="new-tournament-name" placeholder="Tournament Name">
        <button class="action-btn" onclick="createNewTournament()">Create New Tournament</button>
        <div id="tournaments-list-container" style="margin-top:20px;"></div>
    </div>

    <div id="setup-section" class="section">
        <h2>Players Registration</h2>
        <textarea id="players-input" placeholder="Player 1&#10;Player 2&#10;...&#10;Player 32"></textarea>
        <button class="action-btn" onclick="savePlayers()">Save Players</button>
    </div>

    <div id="draw-section" class="section">
        <h2>Group Draw</h2>
        <button class="action-btn" onclick="performDraw()">Randomize Groups (A - H)</button>
        <div id="groups-draw-preview" class="grid" style="margin-top: 20px;"></div>
    </div>

    <div id="standings-section" class="section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 style="margin: 0; flex: 1; text-align: center;">Group Standings</h2>
            <button class="action-btn" style="width: auto; margin: 0; padding: 6px 12px; font-size: 12px;" onclick="openStandingsSS()">Screenshot View</button>
        </div>
        <div class="grid" id="standings-container"></div>
    </div>

    <div id="matches-section" class="section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 style="margin: 0; flex: 1; text-align: center;">Group Matches</h2>
            <button class="action-btn" style="width: auto; margin: 0; padding: 6px 12px; font-size: 12px;" onclick="openMatchesSS()">Screenshot View</button>
        </div>
        <div id="matches-container"></div>
    </div>

    <div id="bracket-section" class="section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 style="margin: 0; flex: 1; text-align: center;">Knockout Stage</h2>
            <button class="action-btn" style="width: auto; margin: 0; padding: 6px 12px; font-size: 12px;" onclick="openBracketSS()">Screenshot View</button>
        </div>
        <button class="action-btn" onclick="generateBracket()" style="margin-bottom: 15px;">Generate / Reset Bracket</button>
        <div id="bracket-container"></div>
    </div>
</div>

<div id="scoreModal" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--accent-color); margin-top:0;">Set Result</h3>
        <div style="display:flex; justify-content:center; align-items:center; gap:10px; margin: 15px 0;">
            <input type="number" id="modalH" min="0" placeholder="0">
            <span style="font-size:20px; font-weight:bold;">:</span>
            <input type="number" id="modalA" min="0" placeholder="0">
        </div>
        <button class="action-btn" onclick="saveModalResult()">Finished</button>
        <button class="action-btn secondary-btn" style="margin-top:8px;" onclick="closeModal()">Cancel</button>
    </div>
</div>

<div id="standingsSSModal" class="ss-fullscreen-modal">
    <div class="ss-header">
        <h3 style="margin:0; color:var(--accent-color); font-size:16px;">Group Standings</h3>
        <button class="action-btn" style="width:auto; margin:0; padding:6px 12px; font-size:11px; background:#e91e63; color:white;" onclick="closeStandingsSS()">Close</button>
    </div>
    <div id="ss-standings-content" class="grid"></div>
</div>

<div id="matchesSSModal" class="ss-fullscreen-modal">
    <div class="ss-header">
        <h3 style="margin:0; color:var(--accent-color); font-size:16px;">All Group Matches</h3>
        <button class="action-btn" style="width:auto; margin:0; padding:6px 12px; font-size:11px; background:#e91e63; color:white;" onclick="closeMatchesSS()">Close</button>
    </div>
    <div id="ss-matches-content"></div>
</div>

<div id="bracketSSModal" class="ss-fullscreen-modal">
    <div class="ss-header">
        <h3 style="margin:0; color:var(--accent-color); font-size:16px;">Knockout Bracket</h3>
        <button class="action-btn" style="width:auto; margin:0; padding:6px 12px; font-size:11px; background:#e91e63; color:white;" onclick="closeBracketSS()">Close</button>
    </div>
    <div id="ss-bracket-content"></div>
</div>

<script>
    let allTournaments = JSON.parse(localStorage.getItem('fc_tournaments') || '{}');
    let currentTournamentId = localStorage.getItem('fc_active_tournament') || null;
    let activeRounds = {};
    let currentEditingMatch = null;

    function initApp() {
        renderTournamentsList();
        if (currentTournamentId && allTournaments[currentTournamentId]) {
            document.getElementById("active-name-display").innerText = currentTournamentId;
            loadTournamentDataToUI();
            
            let t = allTournaments[currentTournamentId];
            let hasGroups = t.groups && Object.keys(t.groups).length > 0;

            if (!hasGroups) {
                document.getElementById("tab-setup").classList.remove("hidden");
                document.getElementById("tab-draw").classList.remove("hidden");
                switchTab('setup', false);
            } else {
                document.getElementById("tab-setup").classList.add("hidden");
                document.getElementById("tab-draw").classList.add("hidden");
                let savedTab = localStorage.getItem('fc_active_tab') || 'standings';
                switchTab(savedTab, false);
            }
        } else {
            switchTab('tournaments', false);
        }
    }

    function switchTab(tabName, save = true) {
        if (tabName !== 'tournaments' && !currentTournamentId) { alert("Select a tournament first!"); return; }
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
        
        let targetSec = document.getElementById(tabName + '-section');
        if(targetSec) targetSec.classList.add('active');

        let tabs = document.querySelectorAll('.nav-tab');
        tabs.forEach(tab => {
            if(tab.getAttribute('onclick') && tab.getAttribute('onclick').includes(tabName)) {
                tab.classList.add('active');
            }
        });
        if(tabName === 'bracket') {
            renderBracket();
        }
        if (save) {
            localStorage.setItem('fc_active_tab', tabName);
        }
    }

    function createNewTournament() {
        let name = document.getElementById("new-tournament-name").value.trim();
        if (!name || allTournaments[name]) { alert("Invalid or existing name!"); return; }
        allTournaments[name] = { players: [], groups: {}, matches: {}, knockout: null };
        saveToLocalStorage();
        selectTournament(name);
        
        document.getElementById("tab-setup").classList.remove("hidden");
        document.getElementById("tab-draw").classList.remove("hidden");
        switchTab('setup');
    }

    function selectTournament(name) {
        currentTournamentId = name;
        localStorage.setItem('fc_active_tournament', name);
        document.getElementById("active-name-display").innerText = name;
        loadTournamentDataToUI();
        renderTournamentsList();
        
        let t = allTournaments[currentTournamentId];
        let hasGroups = t.groups && Object.keys(t.groups).length > 0;

        if (!hasGroups) {
            document.getElementById("tab-setup").classList.remove("hidden");
            document.getElementById("tab-draw").classList.remove("hidden");
            switchTab('setup');
        } else {
            document.getElementById("tab-setup").classList.add("hidden");
            document.getElementById("tab-draw").classList.add("hidden");
            switchTab('standings');
        }
    }

    function deleteTournament(name, event) {
        event.stopPropagation();
        if (confirm(`Are you sure you want to delete tournament "${name}"?`)) {
            delete allTournaments[name];
            saveToLocalStorage();
            if (currentTournamentId === name) {
                currentTournamentId = null;
                localStorage.removeItem('fc_active_tournament');
                document.getElementById("active-name-display").innerText = "None selected";
            }
            renderTournamentsList();
            if (!currentTournamentId) {
                switchTab('tournaments');
            }
        }
    }

    function renderTournamentsList() {
        let container = document.getElementById("tournaments-list-container");
        container.innerHTML = Object.keys(allTournaments).map(name => `
            <div class="tournament-item">
                <b>${name}</b>
                <div style="display:flex; gap:6px;">
                    <button class="action-btn" style="width:auto; margin:0;" onclick="selectTournament('${name}')">Open</button>
                    <button class="action-btn" style="width:auto; margin:0; background:#e91e63; color:white;" onclick="deleteTournament('${name}', event)">Delete</button>
                </div>
            </div>`).join("");
    }

    function saveToLocalStorage() { localStorage.setItem('fc_tournaments', JSON.stringify(allTournaments)); }

    function loadTournamentDataToUI() {
        if (!currentTournamentId) return;
        let t = allTournaments[currentTournamentId];
        document.getElementById("players-input").value = t.players.join("\n");
        renderGroupsPreview(); renderStandings(); renderMatches();
        renderBracket();
    }

    function savePlayers() {
        let list = document.getElementById("players-input").value.trim().split("\n").filter(s => s.trim() !== "");
        if (list.length !== 32) { alert("Need exactly 32 players!"); return; }
        allTournaments[currentTournamentId].players = list;
        saveToLocalStorage();
        switchTab('draw');
    }

    function performDraw() {
        let t = allTournaments[currentTournamentId];
        let shuffled = [...t.players].sort(() => Math.random() - 0.5);
        let groups = ['A','B','C','D','E','F','G','H'];
        t.groups = {}; t.matches = {}; t.knockout = null;
        groups.forEach((g, i) => {
            t.groups[g] = shuffled.slice(i*4, (i+1)*4).map(name => ({
                name, played:0, won:0, drawn:0, lost:0, gf:0, ga:0, points:0
            }));
            t.matches[g] = [
                [0,1], [2,3],
                [0,2], [1,3],
                [0,3], [1,2]
            ].map(p => ({
                p1: p[0], p2: p[1],
                h1: "", a1: "", status1: "Pending",
                h2: "", a2: "", status2: "Pending"
            }));
            activeRounds[g] = 0;
        });
        saveToLocalStorage(); 
        loadTournamentDataToUI();
        
        document.getElementById("tab-setup").classList.add("hidden");
        document.getElementById("tab-draw").classList.add("hidden");
        switchTab('standings');
    }

    function renderGroupsPreview() {
        let container = document.getElementById("groups-draw-preview");
        if(!container) return;
        let t = allTournaments[currentTournamentId];
        if (!t.groups || Object.keys(t.groups).length === 0) {
            container.innerHTML = "<p style='color:#888; text-align:center;'>No groups drawn yet. Click randomize below.</p>";
            return;
        }
        container.innerHTML = Object.keys(t.groups).map(g => `
            <div style="background:var(--bg-element); padding:10px; border-radius:6px;">
                <h3 class="group-title">Group ${g}</h3><ul>${t.groups[g].map(p => `<li>${p.name}</li>`).join("")}</ul>
            </div>`).join("");
    }

    function renderStandingsTable(groupKey) {
        let t = allTournaments[currentTournamentId];
        let sortedPlayers = [...t.groups[groupKey]].sort((a,b) => {
            if(b.points !== a.points) return b.points - a.points;
            let gdB = (b.gf - b.ga);
            let gdA = (a.gf - a.ga);
            if(gdB !== gdA) return gdB - gdA;
            return b.gf - a.gf;
        });

        return `
        <div style="background:var(--bg-element); padding:10px; border-radius:8px;">
            <h3 class="group-title">Group ${groupKey}</h3>
            <table>
                <tr>
                    <th>POS</th>
                    <th>CLUB</th>
                    <th>P</th>
                    <th>W</th>
                    <th>D</th>
                    <th>L</th>
                    <th>GD</th>
                    <th>PTS</th>
                </tr>
                ${sortedPlayers.map((p, idx) => {
                    let gd = p.gf - p.ga;
                    let gdStr = gd > 0 ? `+${gd}` : `${gd}`;
                    let posClass = idx === 0 ? 'pos-1' : (idx === 1 ? 'pos-2' : 'pos-cell');
                    return `<tr>
                        <td class="${posClass}">${idx + 1}</td>
                        <td class="club-cell">${p.name}</td>
                        <td>${p.played}</td>
                        <td>${p.won}</td>
                        <td>${p.drawn}</td>
                        <td>${p.lost}</td>
                        <td>${gdStr}</td>
                        <td style="font-weight:bold; color:var(--accent-color);">${p.points}</td>
                    </tr>`;
                }).join("")}
            </table>
        </div>`;
    }

    function renderStandings() {
        let container = document.getElementById("standings-container");
        if(!container) return;
        let t = allTournaments[currentTournamentId];
        if (!t.groups || Object.keys(t.groups).length === 0) {
            container.innerHTML = "<p style='color:#888; text-align:center;'>Tournament has no groups yet. Go to Setup and Draw tabs.</p>";
            return;
        }
        container.innerHTML = Object.keys(t.groups).map(g => renderStandingsTable(g)).join("");
    }

    function renderMatches() {
        let container = document.getElementById("matches-container");
        if(!container) return;
        container.innerHTML = "";
        let t = allTournaments[currentTournamentId];
        if (!t.matches || Object.keys(t.matches).length === 0) {
            container.innerHTML = "<p style='color:#888; text-align:center;'>No matches generated yet.</p>";
            return;
        }
        Object.keys(t.groups).forEach(g => {
            let card = document.createElement("div");
            card.style.background = "var(--bg-card)";
            card.style.padding = "12px";
            card.style.borderRadius = "8px";
            card.style.marginBottom = "15px";

            let curR = activeRounds[g] || 0;
            let html = `<h3 class="group-title">Group ${g}</h3><div class="round-tabs">${[0,1,2].map(r => `<button class="round-btn ${curR==r?'active':''}" onclick="activeRounds['${g}']= ${r}; renderMatches();">R${r+1}</button>`).join("")}</div>`;
            
            for(let i=0; i<2; i++){
                let mIdx = (curR*2)+i; 
                let m = t.matches[g][mIdx];
                let name1 = t.groups[g][m.p1].name;
                let name2 = t.groups[g][m.p2].name;

                let score1Display = (m.h1 !== "" && m.a1 !== "") ? `${m.h1} : ${m.a1}` : "- : -";
                let score2Display = (m.h2 !== "" && m.a2 !== "") ? `${m.h2} : ${m.a2}` : "- : -";
                
                let bg1 = m.status1 === "Finished" ? "var(--accent-color)" : "#e91e63";
                let color1 = m.status1 === "Finished" ? "#121212" : "#white";
                let bg2 = m.status2 === "Finished" ? "var(--accent-color)" : "#e91e63";

                html += `
                    <div class="match-card">
                        <div class="match-header">Group ${g} - Leg 1</div>
                        <div class="match-content">
                            <div class="team-name">${name1}</div>
                            <div class="score-box" onclick="openModal('${g}', ${mIdx}, 1)">${score1Display}</div>
                            <div class="team-name" style="text-align:right;">${name2}</div>
                        </div>
                        <div style="text-align:center;"><span class="status-badge" style="background:${bg1}; color:${color1};">${m.status1}</span></div>
                    </div>`;

                html += `
                    <div class="match-card">
                        <div class="match-header">Group ${g} - Leg 2</div>
                        <div class="match-content">
                            <div class="team-name">${name2}</div>
                            <div class="score-box" onclick="openModal('${g}', ${mIdx}, 2)">${score2Display}</div>
                            <div class="team-name" style="text-align:right;">${name1}</div>
                        </div>
                        <div style="text-align:center;"><span class="status-badge" style="background:${bg2}; color:${color1};">${m.status2}</span></div>
                    </div>`;
            }
            card.innerHTML = html;
            container.appendChild(card);
        });
    }

    function openStandingsSS() {
        let container = document.getElementById("ss-standings-content");
        let t = allTournaments[currentTournamentId];
        if(!t || !t.groups) return;

        container.innerHTML = Object.keys(t.groups).map(g => renderStandingsTable(g)).join("");
        document.getElementById("standingsSSModal").style.display = "block";
    }

    function closeStandingsSS() {
        document.getElementById("standingsSSModal").style.display = "none";
    }

    function openMatchesSS() {
        let container = document.getElementById("ss-matches-content");
        let t = allTournaments[currentTournamentId];
        if(!t || !t.matches) return;

        let groups = Object.keys(t.groups);
        let roundsHtml = '';

        for (let r = 0; r < 3; r++) {
            let roundBlockHtml = `<div style="background:var(--bg-element); padding:8px; border-radius:6px; border-left:3px solid var(--accent-color); margin-bottom:12px;">`;
            roundBlockHtml += `<h4 style="margin:0 0 8px 0; color:var(--accent-color); font-size:13px; text-align:center; text-transform:uppercase;">Round ${r + 1}</h4>`;

            groups.forEach(g => {
                roundBlockHtml += `<div style="font-size:11px; font-weight:bold; color:var(--group-color); margin:6px 0 2px 2px;">Group ${g}</div>`;
                
                for (let i = 0; i < 2; i++) {
                    let mIdx = (r * 2) + i;
                    let m = t.matches[g][mIdx];
                    let p1Name = t.groups[g][m.p1].name;
                    let p2Name = t.groups[g][m.p2].name;
                    let sLeg1 = (m.h1 !== "" && m.a1 !== "") ? `${m.h1}:${m.a1}` : "-:-";
                    let sLeg2 = (m.h2 !== "" && m.a2 !== "") ? `${m.h2}:${m.a2}` : "-:-";

                    roundBlockHtml += `
                    <div style="font-size:10px; background:#181b20; padding:4px 6px; border-radius:4px; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center;">
                        <span style="flex:1; text-align:right; font-weight:bold; background:#252b33; padding:2px 4px; border-radius:3px; overflow:hidden; text-overflow:ellipsis;">${p1Name}</span>
                        <span style="background:#2d2d2d; padding:2px 6px; border-radius:3px; color:var(--accent-color); font-weight:bold; margin:0 4px; white-space:nowrap;">${sLeg1} | ${sLeg2}</span>
                        <span style="flex:1; text-align:left; font-weight:bold; background:#252b33; padding:2px 4px; border-radius:3px; overflow:hidden; text-overflow:ellipsis;">${p2Name}</span>
                    </div>`;
                }
            });

            roundBlockHtml += `</div>`;
            roundsHtml += roundBlockHtml;
        }

        container.innerHTML = roundsHtml;
        document.getElementById("matchesSSModal").style.display = "block";
    }

    function closeMatchesSS() {
        document.getElementById("matchesSSModal").style.display = "none";
    }

    function generateBracket() {
        let t = allTournaments[currentTournamentId];
        if(!t || !t.groups || Object.keys(t.groups).length === 0) {
            alert("No groups found!");
            return;
        }

        let getTop2 = (gKey) => {
            let sorted = [...t.groups[gKey]].sort((a,b) => {
                if(b.points !== a.points) return b.points - a.points;
                let gdB = (b.gf - b.ga);
                let gdA = (a.gf - a.ga);
                if(gdB !== gdA) return gdB - gdA;
                return b.gf - a.gf;
            });
            return [sorted[0].name, sorted[1].name];
        };

        let gA = getTop2('A'), gB = getTop2('B');
        let gC = getTop2('C'), gD = getTop2('D');
        let gE = getTop2('E'), gF = getTop2('F');
        let gG = getTop2('G'), gH = getTop2('H');

        t.knockout = {
            r16: [
                { p1: gA[0], p2: gB[1], h1:"", a1:"", h2:"", a2:"" },
                { p1: gC[0], p2: gD[1], h1:"", a1:"", h2:"", a2:"" },
                { p1: gE[0], p2: gF[1], h1:"", a1:"", h2:"", a2:"" },
                { p1: gG[0], p2: gH[1], h1:"", a1:"", h2:"", a2:"" },
                { p1: gB[0], p2: gA[1], h1:"", a1:"", h2:"", a2:"" },
                { p1: gD[0], p2: gC[1], h1:"", a1:"", h2:"", a2:"" },
                { p1: gF[0], p2: gE[1], h1:"", a1:"", h2:"", a2:"" },
                { p1: gH[0], p2: gG[1], h1:"", a1:"", h2:"", a2:"" }
            ],
            qf: [
                { p1: "TBD", p2: "TBD", h1:"", a1:"", h2:"", a2:"" },
                { p1: "TBD", p2: "TBD", h1:"", a1:"", h2:"", a2:"" },
                { p1: "TBD", p2: "TBD", h1:"", a1:"", h2:"", a2:"" },
                { p1: "TBD", p2: "TBD", h1:"", a1:"", h2:"", a2:"" }
            ],
            sf: [
                { p1: "TBD", p2: "TBD", h1:"", a1:"", h2:"", a2:"" },
                { p1: "TBD", p2: "TBD", h1:"", a1:"", h2:"", a2:"" }
            ],
            final: [
                { p1: "TBD", p2: "TBD", h1:"", a1:"", h2:"", a2:"" }
            ]
        };

        saveToLocalStorage();
        renderBracket();
    }

    function updateBracketProgression() {
        let t = allTournaments[currentTournamentId];
        if(!t || !t.knockout) return;

        let getWinner = (m) => {
            if(m.h1 === "" || m.a1 === "" || m.h2 === "" || m.a2 === "") return "TBD";
            let p1Total = Number(m.h1) + Number(m.a2);
            let p2Total = Number(m.a1) + Number(m.h2);
            if(p1Total > p2Total) return m.p1;
            if(p2Total > p1Total) return m.p2;
            return m.p1;
        };

        t.knockout.qf[0].p1 = getWinner(t.knockout.r16[0]);
        t.knockout.qf[0].p2 = getWinner(t.knockout.r16[1]);

        t.knockout.qf[1].p1 = getWinner(t.knockout.r16[2]);
        t.knockout.qf[1].p2 = getWinner(t.knockout.r16[3]);

        t.knockout.qf[2].p1 = getWinner(t.knockout.r16[4]);
        t.knockout.qf[2].p2 = getWinner(t.knockout.r16[5]);

        t.knockout.qf[3].p1 = getWinner(t.knockout.r16[6]);
        t.knockout.qf[3].p2 = getWinner(t.knockout.r16[7]);

        t.knockout.sf[0].p1 = getWinner(t.knockout.qf[0]);
        t.knockout.sf[0].p2 = getWinner(t.knockout.qf[1]);

        t.knockout.sf[1].p1 = getWinner(t.knockout.qf[2]);
        t.knockout.sf[1].p2 = getWinner(t.knockout.qf[3]);

        t.knockout.final[0].p1 = getWinner(t.knockout.sf[0]);
        t.knockout.final[0].p2 = getWinner(t.knockout.sf[1]);
    }

    function renderBracket() {
        let container = document.getElementById("bracket-container");
        if(!container) return;
        let t = allTournaments[currentTournamentId];
        if(!t || !t.knockout) {
            container.innerHTML = "<p style='color:#888; text-align:center;'>Click 'Generate / Reset Bracket' above to start knockout stage.</p>";
            return;
        }

        updateBracketProgression();
        saveToLocalStorage();

        container.innerHTML = buildBracketHtml(t.knockout);
    }

    function buildBracketHtml(ko) {
        let html = `<div class="bracket-round-title">Round of 16</div>`;
        ko.r16.forEach((m, idx) => {
            html += renderMatchCardHtml('r16', idx, m, `Round of 16 #${idx+1}`);
        });

        html += `<div class="bracket-round-title">Quarter Finals</div>`;
        ko.qf.forEach((m, idx) => {
            html += renderMatchCardHtml('qf', idx, m, `Quarter Finals #${idx+1}`);
        });

        html += `<div class="bracket-round-title">Semi Finals</div>`;
        ko.sf.forEach((m, idx) => {
            html += renderMatchCardHtml('sf', idx, m, `Semi Finals #${idx+1}`);
        });

        html += `<div class="bracket-round-title">Final</div>`;
        ko.final.forEach((m, idx) => {
            html += renderMatchCardHtml('final', idx, m, `Final`);
        });

        return html;
    }

    function renderMatchCardHtml(roundKey, index, m, title) {
        let s1Leg1 = (m.h1 !== "" && m.a1 !== "") ? m.h1 : "-";
        let s2Leg1 = (m.h1 !== "" && m.a1 !== "") ? m.a1 : "-";
        let s1Leg2 = (m.h2 !== "" && m.a2 !== "") ? m.h2 : "-";
        let s2Leg2 = (m.h2 !== "" && m.a2 !== "") ? m.a2 : "-";

        return `
        <div class="match-card">
            <div class="match-header">${title}</div>
            <div style="display:flex; flex-direction:column; gap:4px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div class="team-name">${m.p1}</div>
                    <div class="score-box-container">
                        <div class="score-box" onclick="openKnockoutModal('${roundKey}', ${index}, 1, 'h')">${s1Leg1}</div>
                        <div class="score-box" onclick="openKnockoutModal('${roundKey}', ${index}, 2, 'h')">${s1Leg2}</div>
                    </div>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div class="team-name">${m.p2}</div>
                    <div class="score-box-container">
                        <div class="score-box" onclick="openKnockoutModal('${roundKey}', ${index}, 1, 'a')">${s2Leg1}</div>
                        <div class="score-box" onclick="openKnockoutModal('${roundKey}', ${index}, 2, 'a')">${s2Leg2}</div>
                    </div>
                </div>
            </div>
        </div>`;
    }

    function openKnockoutModal(roundKey, index, leg, teamType) {
        currentEditingMatch = { type: 'knockout', roundKey, index, leg };
        let m = allTournaments[currentTournamentId].knockout[roundKey][index];
        
        document.getElementById('modalH').value = leg === 1 ? m.h1 : m.h2;
        document.getElementById('modalA').value = leg === 1 ? m.a1 : m.a2;
        document.getElementById('scoreModal').style.display = 'flex';
    }

    function openModal(group, matchIndex, leg) {
        currentEditingMatch = { type: 'group', group, matchIndex, leg };
        let m = allTournaments[currentTournamentId].matches[group][matchIndex];
        
        document.getElementById('modalH').value = leg === 1 ? m.h1 : m.h2;
        document.getElementById('modalA').value = leg === 1 ? m.a1 : m.a2;
        document.getElementById('scoreModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('scoreModal').style.display = 'none';
        currentEditingMatch = null;
    }

    function saveModalResult() {
        if (!currentEditingMatch) return;
        let hVal = document.getElementById('modalH').value;
        let aVal = document.getElementById('modalA').value;

        if (hVal === "" || aVal === "") {
            alert("Please enter both scores!");
            return;
        }

        if (currentEditingMatch.type === 'group') {
            let { group, matchIndex, leg } = currentEditingMatch;
            let m = allTournaments[currentTournamentId].matches[group][matchIndex];

            if (leg === 1) {
                m.h1 = parseInt(hVal);
                m.a1 = parseInt(aVal);
                m.status1 = "Finished";
            } else {
                m.h2 = parseInt(hVal);
                m.a2 = parseInt(aVal);
                m.status2 = "Finished";
            }

            recalculate(group);
            saveToLocalStorage();
            closeModal();
            renderStandings();
            renderMatches();
        } else if (currentEditingMatch.type === 'knockout') {
            let { roundKey, index, leg } = currentEditingMatch;
            let m = allTournaments[currentTournamentId].knockout[roundKey][index];

            if (leg === 1) {
                m.h1 = parseInt(hVal);
                m.a1 = parseInt(aVal);
            } else {
                m.h2 = parseInt(hVal);
                m.a2 = parseInt(aVal);
            }

            saveToLocalStorage();
            closeModal();
            renderBracket();
        }
    }

    function openBracketSS() {
        let container = document.getElementById("ss-bracket-content");
        let t = allTournaments[currentTournamentId];
        if(!t || !t.knockout) {
            container.innerHTML = "<p style='color:#888; text-align:center;'>No bracket generated yet.</p>";
        } else {
            container.innerHTML = buildBracketHtml(t.knockout);
        }
        document.getElementById("bracketSSModal").style.display = "block";
    }

    function closeBracketSS() {
        document.getElementById("bracketSSModal").style.display = "none";
    }

    function recalculate(g) {
        let t = allTournaments[currentTournamentId];
        t.groups[g].forEach(p => { 
            p.played = 0; p.won = 0; p.drawn = 0; p.lost = 0; 
            p.gf = 0; p.ga = 0; p.points = 0; 
        });
        
        t.matches[g].forEach(m => {
            if(m.status1 === "Finished") {
                let p1 = t.groups[g][m.p1], p2 = t.groups[g][m.p2];
                p1.played++; p2.played++;
                p1.gf += m.h1; p1.ga += m.a1;
                p2.gf += m.a1; p2.ga += m.h1;
                
                if(m.h1 > m.a1) { p1.won++; p2.lost++; p1.points += 3; }
                else if(m.h1 < m.a1) { p2.won++; p1.lost++; p2.points += 3; }
                else { p1.drawn++; p2.drawn++; p1.points++; p2.points++; }
            }
            if(m.status2 === "Finished") {
                let p1 = t.groups[g][m.p1], p2 = t.groups[g][m.p2];
                p2.played++; p1.played++;
                p2.gf += m.h2; p2.ga += m.a2;
                p1.gf += m.a2; p1.ga += m.h2;
                
                if(m.h2 > m.a2) { p2.won++; p1.lost++; p2.points += 3; }
                else if(m.h2 < m.a2) { p1.won++; p2.lost++; p1.points += 3; }
                else { p2.drawn++; p1.drawn++; p2.points++; p2.points++; }
            }
        });
    }

    initApp();
</script>
</body>
</html>
