<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile Tournament Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 10px;
        }
        h1, h2, h3, h4 {
            color: #00ffcc;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .active-tournament-banner {
            background: #22252a;
            border: 1px solid #00ffcc;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #1e1e1e;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        .nav-tab {
            background: none;
            border: none;
            color: #888;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            padding: 6px 10px;
            white-space: nowrap;
        }
        .nav-tab.active {
            color: #00ffcc;
            border-bottom: 2px solid #00ffcc;
        }
        .nav-tab.hidden {
            display: none;
        }
        .section {
            display: none;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .section.active {
            display: block;
        }
        textarea, input[type="text"] {
            width: 100%;
            background: #2d2d2d;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        textarea {
            height: 140px;
            resize: vertical;
        }
        button.action-btn {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            display: block;
            width: 100%;
            margin-top: 10px;
        }
        button.action-btn:hover {
            background-color: #00b386;
        }
        .secondary-btn {
            background-color: #333;
            color: #fff;
        }
        .tournament-item {
            background: #252525;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        
        /* Kompaktna tabela koja savršeno staje na mobilni ekran */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 11px;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #333;
            padding: 6px 2px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        th {
            background-color: #2d2d2d;
            color: #00ffcc;
            font-size: 11px;
        }
        /* Širine kolona da sve stane bez skrolovanja */
        th:nth-child(1), td:nth-child(1) { width: 34%; text-align: left; padding-left: 6px; } /* Player name */
        th:nth-child(2), td:nth-child(2) { width: 8%; } /* P (Played) */
        th:nth-child(3), td:nth-child(3) { width: 8%; } /* W (Won) */
        th:nth-child(4), td:nth-child(4) { width: 8%; } /* D (Drawn) */
        th:nth-child(5), td:nth-child(5) { width: 8%; } /* L (Lost) */
        th:nth-child(6), td:nth-child(6) { width: 16%; } /* GD (Goal Diff) */
        th:nth-child(7), td:nth-child(7) { width: 18%; font-weight: bold; color: #00ffcc; } /* Pts */

        .round-tabs {
            display: flex;
            gap: 5px;
            margin: 10px 0 15px 0;
            justify-content: center;
        }
        .round-btn {
            padding: 6px 14px;
            background: #333;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            font-weight: bold;
            font-size: 13px;
        }
        .round-btn.active {
            background: #00ffcc;
            color: #121212;
        }
        
        .match-card {
            background: #252525;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid #333;
            position: relative;
        }
        .match-header {
            text-align: center;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .match-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .team-name {
            font-weight: bold;
            flex: 1;
            text-align: center;
            font-size: 13px;
            word-break: break-word;
        }
        .score-box {
            background: #2d2d2d;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            letter-spacing: 2px;
            color: #00ffcc;
            border: 1px solid #444;
        }
        .score-box:hover {
            border-color: #00ffcc;
        }
        .status-badge {
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 4px;
            color: white;
            margin-top: 6px;
            text-align: center;
            display: inline-block;
            font-weight: bold;
            text-transform: uppercase;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #00ffcc;
            width: 280px;
        }
        .modal-content input {
            width: 50px;
            padding: 8px;
            text-align: center;
            font-size: 18px;
            background: #2d2d2d;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
        }

        .bracket-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }
        .bracket-match {
            background: #252525;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            border-left: 4px solid #00ffcc;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>FC Mobile Tournament</h1>

    <div id="active-banner" class="active-tournament-banner">
        Active Tournament: <b id="active-name-display" style="color: #00ffcc;">None selected</b>
    </div>

    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('tournaments')">Tournaments</button>
        <button id="tab-setup" class="nav-tab hidden" onclick="switchTab('setup')">Setup</button>
        <button id="tab-draw" class="nav-tab hidden" onclick="switchTab('draw')">Draw</button>
        <button class="nav-tab" onclick="switchTab('standings')">Standings</button>
        <button class="nav-tab" onclick="switchTab('matches')">Matches</button>
        <button class="nav-tab" onclick="switchTab('bracket')">Bracket</button>
    </div>

    <div id="tournaments-section" class="section active">
        <h2>Manage Tournaments</h2>
        <input type="text" id="new-tournament-name" placeholder="Tournament Name">
        <button class="action-btn" onclick="createNewTournament()">Create New Tournament</button>
        <div id="tournaments-list-container" style="margin-top:20px;"></div>
    </div>

    <div id="setup-section" class="section">
        <h2>Players Registration</h2>
        <textarea id="players-input" placeholder="Player 1&#10;Player 2&#10;...&#10;Player 32"></textarea>
        <button class="action-btn" onclick="savePlayers()">Save Players</button>
    </div>

    <div id="draw-section" class="section">
        <h2>Group Draw</h2>
        <button class="action-btn" onclick="performDraw()">Randomize Groups (A - H)</button>
        <div id="groups-draw-preview" class="grid" style="margin-top: 20px;"></div>
    </div>

    <div id="standings-section" class="section">
        <h2>Group Standings</h2>
        <div class="grid" id="standings-container"></div>
    </div>

    <div id="matches-section" class="section">
        <h2>Group Matches</h2>
        <div id="matches-container"></div>
    </div>

    <div id="bracket-section" class="section">
        <h2>Knockout Stage</h2>
        <button class="action-btn" onclick="generateBracket()">Generate Bracket</button>
        <div class="bracket-container" id="bracket-container" style="margin-top:20px;"></div>
    </div>
</div>

<!-- Modal Pop-up za unos rezultata -->
<div id="scoreModal" class="modal">
    <div class="modal-content">
        <h3 style="color:#00ffcc; margin-top:0;">Set Result</h3>
        <div style="display:flex; justify-content:center; align-items:center; gap:10px; margin: 15px 0;">
            <input type="number" id="modalH" min="0" placeholder="0">
            <span style="font-size:20px; font-weight:bold;">:</span>
            <input type="number" id="modalA" min="0" placeholder="0">
        </div>
        <button class="action-btn" onclick="saveModalResult()">Finished</button>
        <button class="action-btn secondary-btn" style="margin-top:8px;" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
    let allTournaments = JSON.parse(localStorage.getItem('fc_tournaments') || '{}');
    let currentTournamentId = localStorage.getItem('fc_active_tournament') || null;
    let activeRounds = {};
    let currentEditingMatch = null;

    function initApp() {
        renderTournamentsList();
        if (currentTournamentId && allTournaments[currentTournamentId]) {
            document.getElementById("active-name-display").innerText = currentTournamentId;
            loadTournamentDataToUI();
            document.getElementById("tab-setup").classList.add("hidden");
            document.getElementById("tab-draw").classList.add("hidden");
            switchTab('standings');
        }
    }

    function switchTab(tabName) {
        if (tabName !== 'tournaments' && !currentTournamentId) { alert("Select a tournament first!"); return; }
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
        
        let targetSec = document.getElementById(tabName + '-section');
        if(targetSec) targetSec.classList.add('active');

        let tabs = document.querySelectorAll('.nav-tab');
        tabs.forEach(tab => {
            if(tab.getAttribute('onclick') && tab.getAttribute('onclick').includes(tabName)) {
                tab.classList.add('active');
            }
        });
    }

    function createNewTournament() {
        let name = document.getElementById("new-tournament-name").value.trim();
        if (!name || allTournaments[name]) { alert("Invalid or existing name!"); return; }
        allTournaments[name] = { players: [], groups: {}, matches: {} };
        saveToLocalStorage();
        selectTournament(name);
        
        document.getElementById("tab-setup").classList.remove("hidden");
        document.getElementById("tab-draw").classList.remove("hidden");
        switchTab('setup');
    }

    function selectTournament(name) {
        currentTournamentId = name;
        localStorage.setItem('fc_active_tournament', name);
        document.getElementById("active-name-display").innerText = name;
        loadTournamentDataToUI();
        renderTournamentsList();
        
        document.getElementById("tab-setup").classList.add("hidden");
        document.getElementById("tab-draw").classList.add("hidden");
        switchTab('standings');
    }

    function renderTournamentsList() {
        let container = document.getElementById("tournaments-list-container");
        container.innerHTML = Object.keys(allTournaments).map(name => `
            <div class="tournament-item">
                <b>${name}</b>
                <button class="action-btn" style="width:auto; margin:0;" onclick="selectTournament('${name}')">Open</button>
            </div>`).join("");
    }

    function saveToLocalStorage() { localStorage.setItem('fc_tournaments', JSON.stringify(allTournaments)); }

    function loadTournamentDataToUI() {
        if (!currentTournamentId) return;
        let t = allTournaments[currentTournamentId];
        document.getElementById("players-input").value = t.players.join("\n");
        renderGroupsPreview(); renderStandings(); renderMatches();
    }

    function savePlayers() {
        let list = document.getElementById("players-input").value.trim().split("\n").filter(s => s.trim() !== "");
        if (list.length !== 32) { alert("Need exactly 32 players!"); return; }
        allTournaments[currentTournamentId].players = list;
        saveToLocalStorage();
        switchTab('draw');
    }

    function performDraw() {
        let t = allTournaments[currentTournamentId];
        let shuffled = [...t.players].sort(() => Math.random() - 0.5);
        let groups = ['A','B','C','D','E','F','G','H'];
        t.groups = {}; t.matches = {};
        groups.forEach((g, i) => {
            t.groups[g] = shuffled.slice(i*4, (i+1)*4).map(name => ({
                name, played:0, won:0, drawn:0, lost:0, gf:0, ga:0, points:0
            }));
            t.matches[g] = [
                [0,1], [2,3],
                [0,2], [1,3],
                [0,3], [1,2]
            ].map(p => ({
                p1: p[0], p2: p[1],
                h1: "", a1: "", status1: "Pending",
                h2: "", a2: "", status2: "Pending"
            }));
            activeRounds[g] = 0;
        });
        saveToLocalStorage(); 
        loadTournamentDataToUI();
        
        document.getElementById("tab-setup").classList.add("hidden");
        document.getElementById("tab-draw").classList.add("hidden");
        switchTab('standings');
    }

    function renderGroupsPreview() {
        let container = document.getElementById("groups-draw-preview");
        if(!container) return;
        container.innerHTML = Object.keys(allTournaments[currentTournamentId].groups).map(g => `
            <div style="background:#252525; padding:10px; border-radius:6px;">
                <h3>Group ${g}</h3><ul>${allTournaments[currentTournamentId].groups[g].map(p => `<li>${p.name}</li>`).join("")}</ul>
            </div>`).join("");
    }

    function renderStandings() {
        let container = document.getElementById("standings-container");
        if(!container) return;
        let t = allTournaments[currentTournamentId];
        container.innerHTML = Object.keys(t.groups).map(g => {
            let sortedPlayers = [...t.groups[g]].sort((a,b) => {
                if(b.points !== a.points) return b.points - a.points;
                let gdB = (b.gf - b.ga);
                let gdA = (a.gf - a.ga);
                if(gdB !== gdA) return gdB - gdA;
                return b.gf - a.gf;
            });

            return `
            <div style="background:#252525; padding:10px; border-radius:8px;">
                <h3>Group ${g}</h3>
                <table>
                    <tr>
                        <th>Player</th>
                        <th>P</th>
                        <th>W</th>
                        <th>D</th>
                        <th>L</th>
                        <th>GD</th>
                        <th>Pts</th>
                    </tr>
                    ${sortedPlayers.map(p => {
                        let gd = p.gf - p.ga;
                        let gdStr = gd > 0 ? `+${gd}` : `${gd}`;
                        return `<tr>
                            <td>${p.name}</td>
                            <td>${p.played}</td>
                            <td>${p.won}</td>
                            <td>${p.drawn}</td>
                            <td>${p.lost}</td>
                            <td>${gdStr}</td>
                            <td style="font-weight:bold; color:#00ffcc;">${p.points}</td>
                        </tr>`;
                    }).join("")}
                </table>
            </div>`;
        }).join("");
    }

    function renderMatches() {
        let container = document.getElementById("matches-container");
        if(!container) return;
        container.innerHTML = "";
        let t = allTournaments[currentTournamentId];
        Object.keys(t.groups).forEach(g => {
            let card = document.createElement("div");
            card.style.background = "#1e1e1e";
            card.style.padding = "12px";
            card.style.borderRadius = "8px";
            card.style.marginBottom = "15px";

            let curR = activeRounds[g] || 0;
            let html = `<h3>Group ${g}</h3><div class="round-tabs">${[0,1,2].map(r => `<button class="round-btn ${curR==r?'active':''}" onclick="activeRounds['${g}']= ${r}; renderMatches();">R${r+1}</button>`).join("")}</div>`;
            
            for(let i=0; i<2; i++){
                let mIdx = (curR*2)+i; 
                let m = t.matches[g][mIdx];
                let name1 = t.groups[g][m.p1].name;
                let name2 = t.groups[g][m.p2].name;

                let score1Display = (m.h1 !== "" && m.a1 !== "") ? `${m.h1} : ${m.a1}` : "- : -";
                let score2Display = (m.h2 !== "" && m.a2 !== "") ? `${m.h2} : ${m.a2}` : "- : -";
                
                let bg1 = m.status1 === "Finished" ? "#00ffcc" : "#e91e63";
                let bg2 = m.status2 === "Finished" ? "#00ffcc" : "#e91e63";

                html += `
                    <div class="match-card">
                        <div class="match-header">Group ${g} - Leg 1</div>
                        <div class="match-content">
                            <div class="team-name">${name1}</div>
                            <div class="score-box" onclick="openModal('${g}', ${mIdx}, 1)">${score1Display}</div>
                            <div class="team-name">${name2}</div>
                        </div>
                        <div style="text-align:center;"><span class="status-badge" style="background:${bg1};">${m.status1}</span></div>
                    </div>`;

                html += `
                    <div class="match-card">
                        <div class="match-header">Group ${g} - Leg 2</div>
                        <div class="match-content">
                            <div class="team-name">${name2}</div>
                            <div class="score-box" onclick="openModal('${g}', ${mIdx}, 2)">${score2Display}</div>
                            <div class="team-name">${name1}</div>
                        </div>
                        <div style="text-align:center;"><span class="status-badge" style="background:${bg2};">${m.status2}</span></div>
                    </div>`;
            }
            card.innerHTML = html;
            container.appendChild(card);
        });
    }

    function openModal(group, matchIndex, leg) {
        currentEditingMatch = { group, matchIndex, leg };
        let m = allTournaments[currentTournamentId].matches[group][matchIndex];
        
        document.getElementById('modalH').value = leg === 1 ? m.h1 : m.h2;
        document.getElementById('modalA').value = leg === 1 ? m.a1 : m.a2;
        document.getElementById('scoreModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('scoreModal').style.display = 'none';
        currentEditingMatch = null;
    }

    function saveModalResult() {
        if (!currentEditingMatch) return;
        let hVal = document.getElementById('modalH').value;
        let aVal = document.getElementById('modalA').value;

        if (hVal === "" || aVal === "") {
            alert("Please enter both scores!");
            return;
        }

        let { group, matchIndex, leg } = currentEditingMatch;
        let m = allTournaments[currentTournamentId].matches[group][matchIndex];

        if (leg === 1) {
            m.h1 = parseInt(hVal);
            m.a1 = parseInt(aVal);
            m.status1 = "Finished";
        } else {
            m.h2 = parseInt(hVal);
            m.a2 = parseInt(aVal);
            m.status2 = "Finished";
        }

        recalculate(group);
        saveToLocalStorage();
        closeModal();
        renderStandings();
        renderMatches();
    }

    function recalculate(g) {
        let t = allTournaments[currentTournamentId];
        t.groups[g].forEach(p => { 
            p.played = 0; p.won = 0; p.drawn = 0; p.lost = 0; 
            p.gf = 0; p.ga = 0; p.points = 0; 
        });
        
        t.matches[g].forEach(m => {
            if(m.status1 === "Finished") {
                let p1 = t.groups[g][m.p1], p2 = t.groups[g][m.p2];
                p1.played++; p2.played++;
                p1.gf += m.h1; p1.ga += m.a1;
                p2.gf += m.a1; p2.ga += m.h1;
                
                if(m.h1 > m.a1) { p1.won++; p2.lost++; p1.points += 3; }
                else if(m.h1 < m.a1) { p2.won++; p1.lost++; p2.points += 3; }
                else { p1.drawn++; p2.drawn++; p1.points++; p2.points++; }
            }
            if(m.status2 === "Finished") {
                let p1 = t.groups[g][m.p1], p2 = t.groups[g][m.p2];
                p2.played++; p1.played++;
                p2.gf += m.h2; p2.ga += m.a2;
                p1.gf += m.a2; p1.ga += m.h2;
                
                if(m.h2 > m.a2) { p2.won++; p1.lost++; p2.points += 3; }
                else if(m.h2 < m.a2) { p1.won++; p2.lost++; p1.points += 3; }
                else { p2.drawn++; p1.drawn++; p2.points++; p1.points++; }
            }
        });
    }

    function generateBracket() {
        let t = allTournaments[currentTournamentId];
        let groups = Object.keys(t.groups);
        let html = "<h3>Round of 16</h3>";
        for(let i=0; i<groups.length; i+=2) {
            let p1 = t.groups[groups[i]].sort((a,b)=>b.points-a.points)[0].name;
            let p2 = t.groups[groups[i+1]].sort((a,b)=>b.points-a.points)[1].name;
            html += `<div class="bracket-match"><b>${p1}</b> vs <b>${p2}</b></div>`;
        }
        document.getElementById("bracket-container").innerHTML = html;
    }

    initApp();
</script>
</body>
</html>
