<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile Tournament Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
        }
        h1, h2, h3, h4 {
            color: #00ffcc;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .active-tournament-banner {
            background: #22252a;
            border: 1px solid #00ffcc;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        .nav-tab {
            background: none;
            border: none;
            color: #888;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 12px;
            white-space: nowrap;
        }
        .nav-tab.active {
            color: #00ffcc;
            border-bottom: 2px solid #00ffcc;
        }
        .section {
            display: none;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .section.active {
            display: block;
        }
        textarea, input[type="text"] {
            width: 100%;
            background: #2d2d2d;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        textarea {
            height: 140px;
            resize: vertical;
        }
        button.action-btn {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            display: block;
            width: 100%;
            margin-top: 10px;
        }
        button.action-btn:hover {
            background-color: #00b386;
        }
        .secondary-btn {
            background-color: #333;
            color: #fff;
        }
        .danger-btn {
            background-color: #ff4d4d;
            color: #fff;
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
            display: inline-block;
        }
        .tournament-item {
            background: #252525;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #444;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #2d2d2d;
            color: #aaa;
        }
        .round-tabs {
            display: flex;
            gap: 5px;
            margin: 10px 0 15px 0;
            justify-content: center;
        }
        .round-btn {
            padding: 6px 14px;
            background: #333;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            font-weight: bold;
            font-size: 13px;
        }
        .round-btn.active {
            background: #00ffcc;
            color: #121212;
        }
        .match-card-stacked {
            background: #252525;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        select {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px;
            border-radius: 4px;
            text-align: center;
            width: 100%;
        }
        .bracket-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }
        .bracket-match {
            background: #252525;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            border-left: 4px solid #00ffcc;
            font-size: 13px;
        }
        .top-two {
            background-color: rgba(0, 255, 204, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>FC Mobile Tournament</h1>

    <div id="active-banner" class="active-tournament-banner">
        Active Tournament: <b id="active-name-display" style="color: #00ffcc;">None selected</b>
    </div>

    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('tournaments')">Tournaments</button>
        <button class="nav-tab" onclick="switchTab('setup')">1. Setup</button>
        <button class="nav-tab" onclick="switchTab('draw')">2. Draw</button>
        <button class="nav-tab" onclick="switchTab('standings')">3. Standings</button>
        <button class="nav-tab" onclick="switchTab('matches')">4. Matches</button>
        <button class="nav-tab" onclick="switchTab('bracket')">5. Bracket</button>
    </div>

    <div id="tournaments-section" class="section active">
        <h2>Manage Tournaments</h2>
        <input type="text" id="new-tournament-name" placeholder="Tournament Name">
        <button class="action-btn" onclick="createNewTournament()">Create New Tournament</button>
        <div id="tournaments-list-container" style="margin-top:20px;"></div>
    </div>

    <div id="setup-section" class="section">
        <h2>Players Registration</h2>
        <textarea id="players-input" placeholder="Player 1&#10;Player 2&#10;...&#10;Player 32"></textarea>
        <button class="action-btn" onclick="savePlayers()">Save Players</button>
    </div>

    <div id="draw-section" class="section">
        <h2>Group Draw</h2>
        <button class="action-btn" onclick="performDraw()">Randomize Groups (A - H)</button>
        <div id="groups-draw-preview" class="grid" style="margin-top: 20px;"></div>
    </div>

    <div id="standings-section" class="section">
        <h2>Group Standings</h2>
        <div class="grid" id="standings-container"></div>
    </div>

    <div id="matches-section" class="section">
        <h2>Group Matches</h2>
        <div id="matches-container"></div>
    </div>

    <div id="bracket-section" class="section">
        <h2>Knockout Stage</h2>
        <button class="action-btn" onclick="generateBracket()">Generate Bracket</button>
        <div class="bracket-container" id="bracket-container" style="margin-top:20px;"></div>
    </div>
</div>

<script>
    let allTournaments = JSON.parse(localStorage.getItem('fc_tournaments') || '{}');
    let currentTournamentId = localStorage.getItem('fc_active_tournament') || null;
    let activeRounds = {};

    function initApp() {
        renderTournamentsList();
        if (currentTournamentId && allTournaments[currentTournamentId]) {
            document.getElementById("active-name-display").innerText = currentTournamentId;
            loadTournamentDataToUI();
        }
    }

    function switchTab(tabName) {
        if (tabName !== 'tournaments' && !currentTournamentId) { alert("Select a tournament first!"); return; }
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
        document.getElementById(tabName + '-section').classList.add('active');
        let map = {'tournaments': 0, 'setup': 1, 'draw': 2, 'standings': 3, 'matches': 4, 'bracket': 5};
        document.querySelectorAll('.nav-tab')[map[tabName]].classList.add('active');
    }

    function createNewTournament() {
        let name = document.getElementById("new-tournament-name").value.trim();
        if (!name || allTournaments[name]) { alert("Invalid or existing name!"); return; }
        allTournaments[name] = { players: [], groups: {}, matches: {} };
        saveToLocalStorage();
        selectTournament(name);
        switchTab('setup');
    }

    function selectTournament(name) {
        currentTournamentId = name;
        localStorage.setItem('fc_active_tournament', name);
        document.getElementById("active-name-display").innerText = name;
        loadTournamentDataToUI();
        renderTournamentsList();
    }

    function renderTournamentsList() {
        let container = document.getElementById("tournaments-list-container");
        container.innerHTML = Object.keys(allTournaments).map(name => `
            <div class="tournament-item">
                <b>${name}</b>
                <button class="action-btn" style="width:auto; margin:0;" onclick="selectTournament('${name}')">Open</button>
            </div>`).join("");
    }

    function saveToLocalStorage() { localStorage.setItem('fc_tournaments', JSON.stringify(allTournaments)); }

    function loadTournamentDataToUI() {
        if (!currentTournamentId) return;
        let t = allTournaments[currentTournamentId];
        document.getElementById("players-input").value = t.players.join("\n");
        renderGroupsPreview(); renderStandings(); renderMatches();
    }

    function savePlayers() {
        let list = document.getElementById("players-input").value.trim().split("\n").filter(s => s.trim() !== "");
        if (list.length !== 32) { alert("Need exactly 32 players!"); return; }
        allTournaments[currentTournamentId].players = list;
        saveToLocalStorage();
        switchTab('draw');
    }

    function performDraw() {
        let t = allTournaments[currentTournamentId];
        let shuffled = [...t.players].sort(() => Math.random() - 0.5);
        let groups = ['A','B','C','D','E','F','G','H'];
        t.groups = {}; t.matches = {};
        groups.forEach((g, i) => {
            t.groups[g] = shuffled.slice(i*4, (i+1)*4).map(name => ({name, played:0, points:0, gf:0, ga:0}));
            t.matches[g] = [[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]].map(p => ({p1:p[0], p2:p[1], h1:"", h2:"", a1:"", a2:"", status:"Pending"}));
            activeRounds[g] = 0;
        });
        saveToLocalStorage(); loadTournamentDataToUI();
    }

    function renderGroupsPreview() {
        let container = document.getElementById("groups-draw-preview");
        container.innerHTML = Object.keys(allTournaments[currentTournamentId].groups).map(g => `
            <div style="background:#252525; padding:10px; border-radius:6px;">
                <h3>Group ${g}</h3><ul>${allTournaments[currentTournamentId].groups[g].map(p => `<li>${p.name}</li>`).join("")}</ul>
            </div>`).join("");
    }

    function renderStandings() {
        let container = document.getElementById("standings-container");
        container.innerHTML = Object.keys(allTournaments[currentTournamentId].groups).map(g => `
            <div style="background:#252525; padding:10px; border-radius:6px;">
                <h3>Group ${g}</h3>
                <table><tr><th>Player</th><th>P</th><th>Pts</th></tr>
                ${allTournaments[currentTournamentId].groups[g].sort((a,b)=>b.points-a.points).map(p => `<tr><td>${p.name}</td><td>${p.played}</td><td>${p.points}</td></tr>`).join("")}
                </table>
            </div>`).join("");
    }

    function renderMatches() {
        let container = document.getElementById("matches-container");
        container.innerHTML = "";
        let t = allTournaments[currentTournamentId];
        Object.keys(t.groups).forEach(g => {
            let card = document.createElement("div");
            card.className = "match-card-stacked";
            let curR = activeRounds[g] || 0;
            let html = `<h3>Group ${g}</h3><div class="round-tabs">${[0,1,2].map(r => `<button class="round-btn ${curR==r?'active':''}" onclick="activeRounds['${g}']= ${r}; renderMatches();">R${r+1}</button>`).join("")}</div>`;
            
            for(let i=0; i<2; i++){
                let mIdx = (curR*2)+i; let m = t.matches[g][mIdx];
                let disabled = m.status === "Finished" ? "disabled" : "";
                html += `
                    <div style="border-bottom:1px solid #444; padding-bottom:10px; margin-bottom:10px;">
                        <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:5px;"><span>${t.groups[g][m.p1].name}</span><span>vs</span><span>${t.groups[g][m.p2].name}</span></div>
                        <table style="margin-bottom:10px;">
                            <thead><tr><th>Match</th><th>Home</th><th>Away</th></tr></thead>
                            <tbody>
                                <tr><td>Leg 1</td><td><select ${disabled} onchange="t.matches['${g}'][${mIdx}].h1=this.value; saveToLocalStorage();">${generateOptions(m.h1)}</select></td><td><select ${disabled} onchange="t.matches['${g}'][${mIdx}].h2=this.value; saveToLocalStorage();">${generateOptions(m.h2)}</select></td></tr>
                                <tr><td>Leg 2</td><td><select ${disabled} onchange="t.matches['${g}'][${mIdx}].a1=this.value; saveToLocalStorage();">${generateOptions(m.a1)}</select></td><td><select ${disabled} onchange="t.matches['${g}'][${mIdx}].a2=this.value; saveToLocalStorage();">${generateOptions(m.a2)}</select></td></tr>
                            </tbody>
                        </table>
                        <select onchange="updateMatchStatus('${g}', ${mIdx}, this.value)">
                            <option value="Pending" ${m.status!=='Finished'?'selected':''}>Edit / Pending</option>
                            <option value="Finished" ${m.status==='Finished'?'selected':''}>Finished</option>
                        </select>
                    </div>`;
            }
            card.innerHTML = html;
            container.appendChild(card);
        });
    }

    function generateOptions(val) {
        let opts = `<option value="">-</option>`;
        for(let i=0; i<=10; i++) opts += `<option value="${i}" ${val==i?'selected':''}>${i}</option>`;
        return opts;
    }

    function updateMatchStatus(g, idx, status) {
        let m = allTournaments[currentTournamentId].matches[g][idx];
        if(status === "Finished" && (m.h1===""||m.h2===""||m.a1===""||m.a2==="")) { alert("Fill scores!"); renderMatches(); return; }
        m.status = status;
        recalculate(g); saveToLocalStorage(); renderStandings(); renderMatches();
    }

    function recalculate(g) {
        let t = allTournaments[currentTournamentId];
        t.groups[g].forEach(p => { p.played=0; p.points=0; });
        t.matches[g].forEach(m => {
            if(m.status === "Finished") {
                let p1 = t.groups[g][m.p1], p2 = t.groups[g][m.p2];
                [ {h:m.h1, a:m.h2}, {h:m.a1, a:m.a2} ].forEach(leg => {
                    p1.played++; p2.played++;
                    if(leg.h > leg.a) p1.points+=3; else if(leg.h < leg.a) p2.points+=3; else {p1.points++; p2.points++;}
                });
            }
        });
    }

    function generateBracket() {
        let t = allTournaments[currentTournamentId];
        let groups = Object.keys(t.groups);
        let html = "<h3>Round of 16</h3>";
        for(let i=0; i<groups.length; i+=2) {
            let p1 = t.groups[groups[i]].sort((a,b)=>b.points-a.points)[0].name;
            let p2 = t.groups[groups[i+1]].sort((a,b)=>b.points-a.points)[1].name;
            html += `<div class="bracket-match"><b>${p1}</b> vs <b>${p2}</b></div>`;
        }
        document.getElementById("bracket-container").innerHTML = html;
    }

    initApp();
</script>
</body>
</html>
