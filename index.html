<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile Tournament</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; padding: 10px; }
        .match-card { background: #1e1e1e; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; }
        .player-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
        .player-name { width: 40%; font-weight: bold; font-size: 14px; }
        .score-inputs { display: flex; gap: 5px; align-items: center; }
        select { background: #333; color: #fff; border: 1px solid #555; padding: 4px; border-radius: 4px; }
        button { background: #00ffcc; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="matches-container"></div>

<script>
    // Pretpostavljamo da tvoje podatke vučemo iz localStorage
    let allTournaments = JSON.parse(localStorage.getItem('fc_tournaments') || '{}');
    let currentTournamentId = localStorage.getItem('fc_active_tournament');
    let t = allTournaments[currentTournamentId];

    function renderMatches() {
        let container = document.getElementById("matches-container");
        container.innerHTML = "<h2>Group Matches</h2>";

        for (let g in t.groups) {
            container.innerHTML += `<h3>Group ${g}</h3>`;
            
            // 3 kola (u svakom kolu su 2 meča, svaki meč ima Home i Away)
            for (let round = 0; round < 3; round++) {
                container.innerHTML += `<h4>Round ${round + 1}</h4>`;
                
                // Parovi za to kolo (svaki par igra Home i Away)
                for (let i = 0; i < 2; i++) {
                    let mIdx = (round * 2) + i;
                    let m = t.matches[g][mIdx];
                    
                    container.innerHTML += `
                        <div class="match-card">
                            <div class="player-row">
                                <span class="player-name">${t.groups[g][m.p1].name}</span>
                                <div class="score-inputs">
                                    Home: ${createSelect(g, mIdx, 'h1')} - ${createSelect(g, mIdx, 'h2')}
                                    Away: ${createSelect(g, mIdx, 'a1')} - ${createSelect(g, mIdx, 'a2')}
                                    <button onclick="confirmScore('${g}', ${mIdx})">OK</button>
                                </div>
                                <span class="player-name" style="text-align:right;">${t.groups[g][m.p2].name}</span>
                            </div>
                        </div>`;
                }
            }
        }
    }

    function createSelect(g, idx, field) {
        let val = t.matches[g][idx][field] || 0;
        let html = `<select onchange="updateTemp('${g}', ${idx}, '${field}', this.value)">`;
        for(let i=0; i<=10; i++) html += `<option value="${i}" ${val==i?'selected':''}>${i}</option>`;
        return html + `</select>`;
    }

    // Privremeno čuvanje dok se ne klikne Confirm
    function updateTemp(g, idx, field, val) {
        t.matches[g][idx][field] = parseInt(val);
    }

    function confirmScore(g, idx) {
        let m = t.matches[g][idx];
        // Logika za bodove (zbir Home i Away)
        let totalS1 = m.h1 + m.a1;
        let totalS2 = m.h2 + m.a2;
        
        // Ovde bi išlo ažuriranje tabele...
        alert("Score confirmed! " + t.groups[g][m.p1].name + " " + totalS1 + ":" + totalS2 + " " + t.groups[g][m.p2].name);
        // saveToLocalStorage(); renderStandings();
    }

    renderMatches();
</script>
</body>
</html>
